# FlowSQL 服务编排
# 所有 C++ 服务共用同一镜像，通过启动参数区分角色
# 路由注册和故障恢复由各服务内的 RouterAgencyPlugin KeepAlive 线程自治处理

services:

  # ---- Gateway：统一入口，路由转发 ----
  gateway:
    image: flowsql:latest
    command:
      - flowsql
      - --role
      - gateway
      - --port
      - "18800"
      - --plugins
      - libflowsql_gateway.so
      - --option
      - "host=0.0.0.0;heartbeat_interval_s=10;heartbeat_timeout_count=3"
    ports:
      - "18800:18800"
    networks:
      - flowsql-net
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:18800/gateway/routes"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ---- Web：前端静态资源 + 管理 API ----
  web:
    image: flowsql:latest
    command:
      - flowsql
      - --role
      - web
      - --port
      - "18802"
      - --plugins
      - 'libflowsql_web.so:host=0.0.0.0;port=8081;gateway=gateway:18800;worker_host=pyworker;worker_port=18900;db_path=/opt/flowsql/uploads/web.db;upload_dir=/opt/flowsql/uploads,libflowsql_router.so:host=web;port=18802;gateway=gateway:18800'
    ports:
      - "8081:8081"
    expose:
      - "18802"
    volumes:
      - pcap-uploads:/opt/flowsql/uploads
    networks:
      - flowsql-net
    depends_on:
      gateway:
        condition: service_healthy
    restart: always

  # ---- Scheduler：SQL 执行 + 通道管理 + 算子 ----
  scheduler:
    image: flowsql:latest
    command:
      - flowsql
      - --role
      - scheduler
      - --plugins
      - 'libflowsql_router.so:host=scheduler;port=18803;gateway=gateway:18800,libflowsql_task.so:db_path=/opt/flowsql/uploads/.meta/flowsql_meta.db,libflowsql_npi.so:{"ldfile":"/opt/flowsql/config/protocols.yml"},libflowsql_pcapfile.so:db_path=/opt/flowsql/uploads/.meta/pcapfile.db,libflowsql_config_channel.so:db_path=/opt/flowsql/uploads/.meta/flowsql_meta.db,libflowsql_builtin.so,libflowsql_flow_labeling.so:eal_memory_mib=512,libflowsql_scheduler.so:host=0.0.0.0;port=18803,libflowsql_bridge.so:worker_host=pyworker;worker_port=18900,libflowsql_catalog.so:data_dir=/opt/flowsql/uploads/dataframes;operator_db_path=/opt/flowsql/uploads/.meta/flowsql_meta.db,libflowsql_binaddon.so:operator_db_path=/opt/flowsql/uploads/.meta/flowsql_meta.db;upload_dir=/opt/flowsql/uploads/binaddon,libflowsql_database.so:config_file=/opt/flowsql/config/flowsql.yml,libflowsql_stream.so:config_file=/opt/flowsql/config/flowsql.yml;db_path=/opt/flowsql/uploads/.meta/flowsql_meta.db'
    expose:
      - "18803"
    volumes:
      - flowsql-config:/opt/flowsql/config
      - pcap-uploads:/opt/flowsql/uploads
      - python-ipc:/tmp
      - python-operators:/opt/flowsql/bin/operators
    ipc: service:pyworker
    environment:
      FLOWSQL_GATEWAY_ADDR: gateway:18800
    networks:
      - flowsql-net
    depends_on:
      gateway:
        condition: service_healthy
      pyworker:
        condition: service_healthy
    restart: always

  # ---- Python Worker：Python 算子执行 ----
  pyworker:
    image: flowsql:latest
    command: >
      python3 -m flowsql.worker --host pyworker --port 18900
    environment:
      FLOWSQL_GATEWAY_ADDR: gateway:18800
    ipc: shareable
    shm_size: 512m
    volumes:
      - python-ipc:/tmp
      - python-operators:/opt/flowsql/bin/operators
    expose:
      - "18900"
    networks:
      - flowsql-net
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://pyworker:18900/operators/python/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: always

volumes:
  flowsql-config:
  python-ipc:
  python-operators:
  pcap-uploads:

networks:
  flowsql-net:
    driver: bridge
