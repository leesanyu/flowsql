# Flow Labeling V1 strict configuration example.
#
# Publish this UTF-8 YAML through Config Channel, then bind the immutable
# config.<name>@<revision> reference from npm.basic. Unknown fields, duplicate
# mapping keys, aliases, custom tags, and duplicate label ids/names/priorities
# are rejected before a matcher is published.
#
# Rules are always bidirectional. Each logical rule is expanded into forward
# and endpoint-swapped physical rules, then identical physical rules are
# deduplicated. The single DPDK ACL category returns the matching label with
# the highest priority; label id 0 is reserved for no match.

api_version: flowsql.io/flow-labeling/v1alpha1
kind: FlowLabelingSet

metadata:
  name: corp-primary-labels
  display_name: Corporate primary traffic labels
  description: Replace all example values before publishing.

spec:
  engine:
    type: dpdk-acl
    categories: 1
    algorithm: default                 # default, scalar, sse, avx2, neon,
                                       # altivec, avx512x16, or avx512x32.
    numa_socket_id: any
    max_runtime_bytes: 33554432        # DPDK rte_acl_config.max_size.
    limits:
      max_labels: 10000
      max_logical_rules: 50000
      max_compiled_rules: 100000
      max_expanded_fields: 64
      reject_duplicate_label_priorities: true

  labels:
    - id: 1001
      priority: 3000
      name: corp-web
      display_name: Corporate Web
      description: Corporate HTTPS traffic.

    - id: 1002
      priority: 2000
      name: corp-dns
      display_name: Corporate DNS
      description: Corporate DNS traffic.

    - id: 1003
      priority: 1000
      name: gateway-management
      display_name: Gateway Management
      description: Management traffic involving the gateway MAC.

  # Match fields are AND. Use additional logical rules for OR. Every fact with
  # explicit validity (MAC, IP, VLAN, protocol, or port) automatically receives
  # a hidden presence constraint, so an absent fact cannot match a zero value.
  #
  # Native DPDK operations and safe predefined fields:
  #
  # RANGE:
  #   observation_domain                      8 bytes
  #   source_ipv4_range/destination_ipv4_range 4 bytes
  #   outer_vlan_vid/inner_vlan_vid           2 bytes
  #   source_port/destination_port             2 bytes
  #   transport_protocol_range                 1 byte
  #
  # MASK (value + prefix_bits):
  #   observation_domain_prefix                8 bytes
  #   source/destination_ipv4_prefix            4 bytes
  #   source/destination_ipv6_prefix            four 4-byte ACL parts
  #   source/destination_mac_prefix             2-byte + 4-byte ACL parts
  #   outer/inner_vlan_tpid_prefix              2 bytes
  #   transport_protocol_prefix                 1 byte
  #
  # BITMASK (value + mask):
  #   observation_domain_bitmask                8 bytes
  #   source/destination_ipv4_bitmask            4 bytes; value/mask use IPv4 text
  #   outer/inner_vlan_tpid                      2 bytes
  #   ip_family/transport_protocol               1 byte
  rules:
    - id: corp-web-client-to-server
      label_id: 1001
      direction: bidirectional
      matches:
        - field: observation_domain
          min: 7
          max: 7
        - field: outer_vlan_vid
          min: 20
          max: 22
        - field: destination_ipv4_prefix
          value: "10.30.0.0"
          prefix_bits: 16
        - field: transport_protocol
          value: 6                       # TCP
          mask: 255
        - field: destination_port
          min: 443
          max: 443

    - id: corp-dns-ip-range
      label_id: 1002
      direction: bidirectional
      matches:
        - field: destination_ipv4_range
          min: "10.40.0.10"
          max: "10.40.0.99"
        - field: transport_protocol
          value: 17                      # UDP
          mask: 255
        - field: destination_port
          min: 53
          max: 53

    - id: gateway-source-mac
      label_id: 1003
      direction: bidirectional
      matches:
        - field: source_mac_prefix
          value: "00:11:22:33:44:55"
          prefix_bits: 48

    - id: ipv6-inner-vlan-example
      label_id: 1002
      direction: bidirectional
      matches:
        - field: inner_vlan_tpid
          value: 34984                   # 0x88a8
          mask: 65535
        - field: inner_vlan_vid
          min: 100
          max: 100
        - field: destination_ipv6_prefix
          value: "2001:db8:1::"
          prefix_bits: 48

    # An intentionally global rule must say match_all explicitly. Its forward
    # and reverse forms are identical and compile to one physical rule.
    # - id: explicit-catch-all
    #   label_id: 1003
    #   direction: bidirectional
    #   match_all: true
