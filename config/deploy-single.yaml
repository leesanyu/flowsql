# FlowSQL 默认原生配置（核心 C++ 插件共进程，visualization 与 pyworker 独立 fork）
# 启动：flowsql --config config/deploy-single.yaml

services:
  - name: all
    plugins:
      - name: libflowsql_gateway.so
        option: "host=127.0.0.1;port=18800;heartbeat_interval_s=10;heartbeat_timeout_count=3"
      - name: libflowsql_web.so
        option: "host=127.0.0.1;port=8081;gateway=127.0.0.1:18800;upload_dir=./uploads;visualization_upstream=http://127.0.0.1:18910"
      - name: libflowsql_router.so
        option: "host=127.0.0.1;port=18803;gateway=127.0.0.1:18800"
      - name: libflowsql_task.so
        option: "db_path=./meta/flowsql_meta.db"
      - name: libflowsql_npi.so
        option: '{"ldfile":"./config/protocols.yml"}'
      - name: libflowsql_pcapfile.so
        option: "db_path=./meta/flowsql_meta.db"
      - name: libflowsql_netadapter.so
        option: '{"db_path":"./meta/netadapter.db"}'
      - libflowsql_capture_af_packet.so
      - libflowsql_capture_pfring.so
      - libflowsql_capture_af_xdp.so
      - name: libflowsql_config_channel.so
        option: "db_path=./meta/flowsql_meta.db"
      - name: libflowsql_flow_labeling.so
        option: "eal_memory_mib=512"
      - libflowsql_baseline.so
      # Default deployment initializes persistent config/key once, outside build/output (docs/kafka.md).
      - name: libflowsql_kafka.so
        option: '{}'
      - libflowsql_scheduler.so
      - libflowsql_bridge.so
      - libflowsql_builtin.so
      - name: libflowsql_catalog.so
        # exploration_shared_dir is the data plane for DataFrame snapshots: the source service
        # publishes Arrow IPC objects here and the visualization service maps them read-only.
        # It must live on a POSIX filesystem: both sides require a 0700 directory, which 9p/DrvFs
        # mounts (e.g. /mnt/d) cannot represent because chmod is a no-op there.
        option: "data_dir=./dataframes;operator_db_path=./meta/flowsql_meta.db;exploration_shared_dir=/var/tmp/flowsql/exploration-shared"
      - name: libflowsql_binaddon.so
        option: "operator_db_path=./meta/flowsql_meta.db;upload_dir=./uploads/binaddon"
      - name: libflowsql_database.so
        option: "config_file=config/flowsql.yml"
      - name: libflowsql_stream.so
        option: "config_file=config/flowsql.yml;db_path=./meta/flowsql_meta.db"

  - name: visualization
    # dataframe_upstream points at the service that owns the DataFrame channels; both processes must
    # use the same dataframe_shared_dir. Without both keys the database path stays available.
    option: '{"host":"127.0.0.1","port":18910,"static_dir":"exploration","dataframe_upstream":"http://127.0.0.1:18803","dataframe_shared_dir":"/var/tmp/flowsql/exploration-shared"}'
    plugins:
      - name: libflowsql_database.so
        option: "config_file=config/flowsql.yml"
      - name: libflowsql_visualization.so

  - name: pyworker
    type: python
    command: "python3 -m flowsql.worker --port 18900"
