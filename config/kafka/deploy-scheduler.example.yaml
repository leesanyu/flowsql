# Copy to deploy-scheduler.yaml; retains the existing Compose Scheduler plugin set.
services:
- name: scheduler
  plugins:
  - name: libflowsql_router.so
    option: host=scheduler;port=18803;gateway=gateway:18800
  - name: libflowsql_kafka.so
    option: config_file=/opt/flowsql/kafka/provider.json
  - name: libflowsql_task.so
    option: db_path=/opt/flowsql/uploads/.meta/flowsql_meta.db
  - name: libflowsql_npi.so
    option: '{"ldfile":"/opt/flowsql/config/protocols.yml"}'
  - name: libflowsql_pcapfile.so
    option: db_path=/opt/flowsql/uploads/.meta/pcapfile.db
  - name: libflowsql_config_channel.so
    option: db_path=/opt/flowsql/uploads/.meta/flowsql_meta.db
  - name: libflowsql_builtin.so
  - name: libflowsql_flow_labeling.so
    option: eal_memory_mib=512
  - name: libflowsql_scheduler.so
    option: host=0.0.0.0;port=18803
  - name: libflowsql_bridge.so
    option: worker_host=pyworker;worker_port=18900
  - name: libflowsql_catalog.so
    option: data_dir=/opt/flowsql/uploads/dataframes;operator_db_path=/opt/flowsql/uploads/.meta/flowsql_meta.db
  - name: libflowsql_binaddon.so
    option: operator_db_path=/opt/flowsql/uploads/.meta/flowsql_meta.db;upload_dir=/opt/flowsql/uploads/binaddon
  - name: libflowsql_database.so
    option: config_file=/opt/flowsql/config/flowsql.yml
  - name: libflowsql_stream.so
    option: config_file=/opt/flowsql/config/flowsql.yml;db_path=/opt/flowsql/uploads/.meta/flowsql_meta.db
