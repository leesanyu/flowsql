channels:
  database_channels: []
  stream_channels:
  - type: ring
    name: demo
    role: both
    options:
      ring_size: 64
      batch_rows: 1024
      overflow: drop
      ring_mode: spsc
      finite: false
  - type: tcp_session_mock
    name: tcp_src
    role: both
    options:
      mode: keyed
      total_records: 64
      batch_rows: 8
      partition_count: 4
      emit_interval_ms: 0
      ring_size: 256
      overflow: drop
