# Run from build/output: ./flowsql --config config/deploy-visualization.yaml
# The exploration process does not load database management HTTP routes.
services:
  - name: visualization
    # dataframe_upstream points at the service that owns the DataFrame channels; both processes must
    # use the same dataframe_shared_dir. Without both keys the database path stays available.
    # The directory must be 0700 on a POSIX filesystem; 9p/DrvFs mounts (e.g. /mnt/d) cannot be.
    option: '{"host":"127.0.0.1","port":18910,"static_dir":"exploration","dataframe_upstream":"http://127.0.0.1:18803","dataframe_shared_dir":"/var/tmp/flowsql/exploration-shared"}'
    plugins:
      - name: libflowsql_database.so
        option: "config_file=config/flowsql.yml"
      - name: libflowsql_visualization.so
